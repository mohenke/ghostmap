server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text, JSON (OSM snapshot ~0.9 MB → ~0.15 MB), models and wasm.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary application/wasm;

    # Health check for Coolify / Docker
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built JS/CSS have content hashes in their names – cache "forever".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Data, 3D model, environment light and Draco decoder: cache for a day.
    location ~ \.glb$ {
        default_type model/gltf-binary;
        expires 1d;
        try_files $uri =404;
    }
    location ~ ^/(data|draco|hdri)/ {
        expires 1d;
        try_files $uri =404;
    }

    # The app shell must always be fresh so new deploys show up immediately.
    location / {
        # (add_header in a location replaces server-level headers, so they live here)
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Only the open-data services the app actually uses may be contacted.
        # Keep in sync with preview.headers in vite.config.ts.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://upload.wikimedia.org https://*.wikimedia.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://opendata-download-metfcst.smhi.se https://data.sensor.community https://sv.wikipedia.org https://s3.amazonaws.com https://overpass-api.de https://overpass.kumi.systems https://maps.mail.ru https://nominatim.openstreetmap.org; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
